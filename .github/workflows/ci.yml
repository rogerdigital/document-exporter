name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check:version
      - run: npm run lint:obsidian-warnings
      - run: npx tsc -noEmit -skipLibCheck
      - run: npm run build
      - run: npm test
